name: barcode-scanner-app

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
      - path: /admin
    envs:
      - key: DJANGO_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: https://${APP_DOMAIN}
      - key: DEBUG
        scope: RUN_TIME
        value: "False"
      - key: FERNET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: SENTRY_RELEASE
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}
      # Declared at its default so the trace baseline can be lowered by editing
      # a value here. Adding a key that is absent would itself be a deploy.
      - key: SENTRY_TRACES_SAMPLE_RATE
        scope: RUN_TIME
        value: "0.05"

  - name: frontend
    dockerfile_path: barcode-scanner-frontend/Dockerfile
    source_dir: barcode-scanner-frontend
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: REACT_APP_API_BASE_URL
        scope: BUILD_TIME
        value: https://${APP_DOMAIN}
      # RUN_TIME, unlike REACT_APP_API_BASE_URL above, and only because this
      # container runs the CRA dev server (`npm start`): process.env is read
      # when the server starts, so a run-time value takes effect on restart
      # with no rebuild. If the frontend is ever converted to a real production
      # build these must move to BUILD_TIME — a pre-built bundle has the value
      # inlined at compile time, so at run time the DSN would be `undefined`
      # and the frontend would silently stop reporting.
      - key: REACT_APP_SENTRY_DSN
        scope: RUN_TIME
        type: SECRET
      - key: REACT_APP_SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: REACT_APP_SENTRY_RELEASE
        scope: RUN_TIME
        value: ${_self.COMMIT_HASH}

databases:
  - name: db
    engine: PG
    production: false
    cluster_name: barcode-scanner-db
    db_name: barcode_scanner
    db_user: barcode_scanner
