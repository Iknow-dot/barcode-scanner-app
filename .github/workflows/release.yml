name: Release

# A release is a git tag: `git tag -a v1.4.0 -m "..." && git push origin v1.4.0`.
# See docs/releasing.md. Deploying the live DigitalOcean app is unaffected: it
# still follows pushes to djangoRewrite.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Parse version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH (optionally -suffix, e.g. v1.4.0-rc.1)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"

  backend-tests:
    needs: version
    uses: ./.github/workflows/backend-tests.yml

  frontend-tests:
    needs: version
    uses: ./.github/workflows/frontend-tests.yml

  images:
    name: Build ${{ matrix.component }} image
    needs: [version, backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # only used when IMAGE_NAMESPACE is on ghcr.io
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: barcode-scanner-frontend
    env:
      # Repository variable, e.g. registry.digitalocean.com/iknow or ghcr.io/iknow-dot.
      # Unset: the images are built (proving the release builds) but not pushed.
      IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          name="iflow-$COMPONENT"
          if [ -n "$IMAGE_NAMESPACE" ]; then
            {
              echo "ref=${IMAGE_NAMESPACE%/}/$name:$VERSION"
              echo "registry=${IMAGE_NAMESPACE%%/*}"
              echo "push=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::IMAGE_NAMESPACE is not set; building $name:$VERSION without pushing it anywhere"
            {
              echo "ref=$name:$VERSION"
              echo "push=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          # Falls back to the workflow token, which is enough for ghcr.io.
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ steps.image.outputs.push == 'true' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  github-release:
    name: Publish GitHub release
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
