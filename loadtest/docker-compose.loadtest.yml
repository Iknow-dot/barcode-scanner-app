# Production-shaped load-test stack. Deliberately NOT an override of the dev
# docker-compose.yml: that file replaces the image CMD with `runserver`, which
# has no worker ceiling and no gunicorn queueing, so any capacity number
# measured against it would be meaningless. Here the image runs as shipped.
#
# Host ports are shifted off the dev stack's so both can run at once.
#
# Network: no custom `networks:` section here on purpose, so compose creates
# its normal default network, named `<project>_default` from the `name:`
# below (i.e. `barcode-loadtest_default`) — the later k6 tasks join this
# network by name, and an unusual custom network name would only make that
# harder.
name: barcode-loadtest

services:
  backend:
    build:
      context: ../backend
    # No `command:` override — the image's own CMD (migrate, collectstatic,
    # gunicorn --workers 2 --threads 4) is the thing under test.
    #
    # Belt-and-braces for any remaining startup race: the backend's CMD runs
    # migrate immediately, and toxiproxy/db may not be accepting connections
    # yet even though their containers have started. Restart rather than
    # crash-loop-and-stay-dead.
    restart: on-failure
    ports:
      - "8280:8080"
    depends_on:
      - toxiproxy
      - fake-1c
    # basic-xxs is 512 MB and a shared vCPU. Two gunicorn workers inside that
    # is already tight; an OOM kill under load is a finding, not a setup bug.
    cpus: 1.0
    mem_limit: 512m
    environment:
      - DJANGO_SECRET_KEY=loadtest-secret-key-not-for-production
      # Through toxiproxy, so managed-Postgres RTT can be injected. Without it
      # an N+1 costs ~0.1 ms/query here versus ~2 ms on DO and the run
      # under-reports exactly the problem it exists to find.
      - DATABASE_URL=postgres://postgres:postgres@toxiproxy:5432/postgres
      - DATABASE_SSL_REQUIRE=False
      - DEBUG=False
      - SECURE_SSL_REDIRECT=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3100
      - FERNET_KEY=MO69AxjxiFlmlCCZiZ1Bm3gOnlAa9iVKgnc67BV0jPA=
      - PERF_HEADERS_ENABLED=True
      - LOG_LEVEL=WARNING

  db:
    image: postgres:17
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5533:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - loadtest_pgdata:/var/lib/postgresql/data

  # Sits between Django and Postgres so a `latency` toxic can model the
  # managed-DB round trip, and so a DB stall is injectable on demand. The
  # `postgres` proxy is declared up front in ./toxiproxy/config.json (NOT
  # created after the fact by up.sh) because the backend's own CMD runs
  # `manage.py migrate` immediately on start against a DATABASE_URL that
  # already points at toxiproxy — if the proxy didn't exist yet at that
  # moment the backend would crash-loop before anything could create it.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/config.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"
    depends_on:
      - db

  fake-1c:
    build:
      context: ./fake_1c
    ports:
      - "8099:8099"

volumes:
  loadtest_pgdata:
