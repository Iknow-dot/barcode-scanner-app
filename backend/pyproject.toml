[project]
name = "barcode-scanner-app"
version = "0.1.0"
description = "Barcode Scanner Application"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44.0.0",
    "dj-database-url>=2.3.0",
    "django>=6.0.2",
    "django-cors-headers>=4.7.0",
    "django-filter>=25.2",
    "django-jazzmin>=3.0.3",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.2",
    "psycopg2-binary>=2.9.10",
    "whitenoise>=6.8.2",
    "bleach[css]>=6.1.0",
    "lxml>=5.0.0",
    "sentry-sdk[django]>=2.69,<3",
]

[tool.uv]
# Django project, not a distributable package: never build/install it into the venv.
# Explicit so adding a [build-system] later does not flip uv to package mode.
package = false
