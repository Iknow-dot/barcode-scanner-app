<div class="screen" style="background: #e8e8e8;">
  <div class="dim"></div>
  <div class="under"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <div class="navbar">
      <div class="glass-btn">[[i:close:20:2.4]]</div>
      <div class="nav-title">კლიენტის მოძიება</div>
      <div style="width: 44px; flex: none;"></div>
    </div>

    <div class="section-h" style="padding-top: 8px;">პირადი ნომერი, ტელეფონი ან სახელი</div>
    <div style="padding: 0 16px;">
      <div class="search" style="background: #fff; box-shadow: 0 0 0 2px var(--tint); gap: 4px;">
        [[i:search:20:2.4]]
        <span class="typed num" style="margin-left: 4px;">599 88 12 40</span>
        <span class="trail" style="color: var(--label-3);">[[i:close:18:2.6]]</span>
        <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: var(--tint-soft); color: var(--tint-text); display: flex; align-items: center; font-size: 15px; font-weight: 700; flex: none;">აბგ</span>
      </div>
    </div>
    <div class="section-f" style="display: flex; align-items: center; gap: 6px;">[[i:phone:14:2.2]]ძებნა ნომრით</div>

    <div class="group" style="margin-top: 22px;">
      <div class="row">
        <span class="l2">[[i:spinner:20:2.4]]</span>
        <div class="row-main body l2">კლიენტი იძებნება...</div>
      </div>
    </div>

    <div class="sheet-bottom" style="bottom: 268px;">
      <div class="btn gray">გაგრძელება კლიენტის გარეშე</div>
    </div>
  </div>

  <!-- iOS number pad (inputmode="numeric") -->
  <div class="numpad">
    <div class="numpad-grid">
      <b>1<i>&nbsp;</i></b><b>2<i>ABC</i></b><b>3<i>DEF</i></b>
      <b>4<i>GHI</i></b><b>5<i>JKL</i></b><b>6<i>MNO</i></b>
      <b>7<i>PQRS</i></b><b>8<i>TUV</i></b><b>9<i>WXYZ</i></b>
      <span></span><b>0</b><span class="numpad-del">[[i:backspace:26:1.8]]</span>
    </div>
  </div>
</div>
